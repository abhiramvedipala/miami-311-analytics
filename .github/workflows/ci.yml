name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make setup
      - run: make test
      - name: Pipeline on offline sample
        run: make sample
      - name: RESULTS.md was written by scripts
        run: .venv/bin/python src/results.py RESULTS.md
